name: Add a tool
description: Suggest an AI tool to add to the directory
title: "Add: "
labels: ["new-tool"]
body:
  - type: input
    id: name
    attributes:
      label: Tool name
      placeholder: "Spellbook"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official URL
      placeholder: "https://spellbook.com"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which existing category does this belong in? If none fit, open a "Suggest a category" issue instead.
      options:
        - AI Tools for Contract Review & Analysis
        - AI Tools for Legal Research & Case Law Analysis
        - AI Tools for E-Discovery & Litigation Document Review
        - AI Tools for Legal Billing & Timekeeping Automation
        - AI Tools for Legal Document Drafting & Automation
        - AI Tools for Compliance & Regulatory Monitoring
        - AI Tools for IP & Patent Research and Drafting
        - AI Tools for Client Intake & Legal Chatbots
        - Other / not sure
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: One-line description
      description: Factual, ≤160 characters, no superlatives.
      placeholder: "AI add-in for Microsoft Word that drafts and reviews contract clauses inside a lawyer's existing workflow."
    validations:
      required: true
  - type: dropdown
    id: pricing
    attributes:
      label: Pricing tier
      options:
        - Free
        - Freemium
        - Paid
        - Paid (enterprise/custom pricing)
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure
      options:
        - label: I'm not affiliated with this tool, or I've said so above/below
